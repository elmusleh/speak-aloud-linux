name: TTS Linux Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            tesseract-ocr \
            tesseract-ocr-eng \
            x11-utils \
            xdotool \
            xvfb \
            ffmpeg \
            shellcheck

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 edge-tts Pillow pytest faster-whisper

      - name: Run ShellCheck on Shell Scripts
        run: |
          shellcheck *.sh

      - name: Run Pytest Test Suite under Xvfb
        run: |
          xvfb-run -a pytest -v tests/test_tts_suite.py
